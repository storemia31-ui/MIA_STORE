<style>
:root{
  /* EDIT SITE COLORS HERE */
  --cream:#fbf8f4; --bg:#e1d3c0; --paper:#ebe0d1; --panel:#d6c4ad; --ink:#3a241c; --mute:#6b5848;
  --line:#cdbba6; --accent:#423225; --accent-2:#5a4435; --danger:#9b2c2c; --wa:#1fa855;
  --line:#cbb9a6; --accent:#5f4b3b; --accent-2:#806954; --danger:#9b2c2c; --wa:#1fa855;
  --r:10px; --ease:cubic-bezier(.2,.7,.2,1);
  --font-en:'Inter',system-ui,sans-serif;
  --font-disp-en:'Inter',sans-serif;
  --font-ar:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:84px;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-en);font-size:16px;line-height:1.55;overflow-x:hidden}
[dir=rtl] body, [dir=rtl] button, [dir=rtl] input, [dir=rtl] textarea, [dir=rtl] select{font-family:var(--font-ar)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
img{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
body.lock{overflow:hidden}
.wrap{width:min(1240px,100% - 40px);margin-inline:auto}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:50;background:rgba(251,248,244,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:78px;gap:16px}
.logo{display:inline-flex;align-items:center;text-decoration:none;font:700 2.2rem/1 'Playfair Display',Georgia,serif;color:var(--ink)}
.logo img{height:46px;width:auto}
#footLogo img{height:42px}
nav.main{display:flex;gap:36px;font-size:.95rem}
nav.main a{text-decoration:none;padding:6px 0;border-bottom:2px solid transparent;transition:border-color .2s}
nav.main a:hover,nav.main a.on{border-color:var(--ink)}
.actions{display:flex;align-items:center;gap:14px}
.pill{height:36px;padding:0 14px;border:1px solid var(--ink);border-radius:999px;font-size:.85rem;font-weight:500;transition:background .2s,color .2s}
.pill:hover{background:var(--ink);color:#fff}
.cart-btn{position:relative;width:40px;height:40px;display:grid;place-items:center}
.cart-btn .ico{font-size:26px}
.cart-count{position:absolute;top:-2px;inset-inline-end:-6px;min-width:20px;height:20px;border-radius:99px;background:var(--accent);color:#fff;font-size:.72rem;display:grid;place-items:center;padding:0 5px;transition:transform .3s var(--ease)}
.cart-count.bump{transform:scale(1.35)}
.ico{display:inline-flex;font-size:1.2em}
.ico svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
[dir=rtl] .flip{transform:scaleX(-1)}
@media(max-width:860px){nav.main{display:none}}

/* ---------- hero ---------- */
.hero h1 .ln{display:block;overflow:hidden;padding-bottom:.06em}
.hero h1 .ln>span{display:block;transform:translateY(105%);animation:rise 1s var(--ease) forwards}
.hero h1 .ln:nth-child(2)>span{animation-delay:.12s}
.hero h1 .ln:nth-child(3)>span{animation-delay:.24s}
@keyframes rise{to{transform:none}}
@keyframes fadein{to{opacity:1}}
.btn{height:52px;padding:0 28px;border-radius:var(--r);background:var(--ink);color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;border:1px solid var(--ink);transition:background .2s,transform .2s,color .2s}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.wa{background:var(--wa);border-color:var(--wa)}
.btn.wa:hover{background:#188a45;border-color:#188a45}
.btn[disabled]{opacity:.5;pointer-events:none}

/* hero (edit sizes / colors here) */
.hero{position:relative;overflow:hidden;padding:0;--fade:to right;background:linear-gradient(180deg,var(--cream),#f4ece3 60%,var(--bg))}
[dir=rtl] .hero{--fade:to left}
.hero-slides{position:absolute;inset-block:0;inset-inline-end:0;width:32%;-webkit-mask-image:linear-gradient(var(--fade),transparent,#000 32%);mask-image:linear-gradient(var(--fade),transparent,#000 32%)}
.hero-slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;opacity:0;transition:opacity .9s var(--ease)}
.hero-slides img.on{opacity:1}
.hero-slides img.fb{object-fit:contain;object-position:center bottom;padding-top:8px}
.hero-inner{position:relative;z-index:2;min-height:clamp(220px,18vw,280px);display:flex;align-items:center}
.hero-copy{max-width:420px;padding:18px 0}
.eyebrow{font-size:.8rem;font-weight:500;letter-spacing:.28em;text-transform:uppercase;margin-bottom:18px}
[dir=rtl] .eyebrow{letter-spacing:0;font-size:.95rem}
.hero h1{font-family:var(--font-disp-en);font-weight:800;font-size:clamp(3rem,6.4vw,5.4rem);line-height:1;letter-spacing:-.035em}
[dir=rtl] .hero h1{font-family:var(--font-ar);font-weight:700;letter-spacing:0;line-height:1.25}
.hero p.sub{margin:26px 0 34px;color:var(--mute);font-size:1.05rem;line-height:1.9;white-space:pre-line;opacity:0;animation:fadein .8s .55s var(--ease) forwards}
.hero .btn{border-radius:999px;height:56px;padding:0 32px;opacity:0;animation:fadein .8s .7s var(--ease) forwards}
.hero-nav{position:absolute;inset:0;z-index:3;pointer-events:none}
.counter{position:absolute;top:28%;inset-inline-end:clamp(14px,3vw,44px);display:flex;flex-direction:column;align-items:center;gap:14px;font-size:.85rem;color:var(--mute)}
.vline{position:relative;width:1px;height:56px;background:var(--line)}
.vline b{position:absolute;top:0;inset-inline:0;background:var(--ink);transition:height .5s var(--ease)}
.arrows{position:absolute;bottom:48px;inset-inline-end:clamp(14px,3vw,44px);display:flex;flex-direction:column;gap:12px;pointer-events:auto}
.arrow-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--mute);display:grid;place-items:center;transition:.2s}
.arrow-btn:hover{background:var(--ink);color:#fff}
.arrow-btn.fill{background:var(--accent);border-color:var(--accent);color:#fff}
@media(max-width:860px){
  .hero{display:flex;flex-direction:column}
  .hero-slides{position:relative;width:100%;height:150px;order:-1;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
  .hero-inner{min-height:0}.hero-copy{padding:8px 0 20px}
  .counter{display:none}.arrows{top:120px;bottom:auto;flex-direction:row}
}

/* ---------- sections ---------- */
section{padding:clamp(48px,7vw,96px) 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:36px;flex-wrap:wrap}
h2{font-family:var(--font-disp-en);font-weight:700;font-size:clamp(1.9rem,4vw,3rem);letter-spacing:-.035em;line-height:1.05}
[dir=rtl] h2{font-family:var(--font-ar);letter-spacing:0;line-height:1.3}
.sec-head p{color:var(--mute);max-width:46ch}

/* products */
.sec-head .eyebrow{margin-bottom:10px}
.view-all{display:inline-flex;align-items:center;gap:10px;font-weight:500;border-bottom:1px solid var(--ink);padding-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
.card{cursor:pointer;display:flex;flex-direction:column}
.card .ph{position:relative;aspect-ratio:850/1024;background:var(--panel);border-radius:12px;overflow:hidden}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .45s var(--ease),transform .8s var(--ease)}
.card .ph img.b{opacity:0}
.card:hover .ph img.b{opacity:1}
.card:hover .ph img.a{transform:scale(1.02)}
.badge{position:absolute;top:12px;inset-inline-start:12px;z-index:2;background:var(--accent);color:#fff;font-size:.72rem;font-weight:500;padding:4px 12px;border-radius:99px}
.card h3{font-weight:600;font-size:1.02rem;margin-top:16px}
.card .clr{color:var(--mute);font-size:.88rem}
.card .price{font-weight:600;margin:12px 0}
.add-btn{height:46px;border-radius:14px;background:var(--accent);color:#fff;font-size:.9rem;font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .2s}
.add-btn:hover{background:var(--accent-2)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}

/* trust bar */
.trust{padding:0 0 clamp(32px,5vw,56px)}
.trust-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding-top:36px}
.trust-item{display:flex;align-items:center;gap:16px;padding:0 22px;border-inline-start:1px solid var(--line)}
.trust-item:first-child{border:0;padding-inline-start:0}
.trust-item .ico{font-size:2.3rem}
.trust-item b{display:block;font-weight:500}
.trust-item small{color:var(--mute);font-size:.85rem}
@media(max-width:860px){.trust-grid{grid-template-columns:1fr 1fr;gap:24px}.trust-item,.trust-item:first-child{border:0;padding:0}}

/* size guide */
.table-wrap{overflow-x:auto;background:var(--paper);border-radius:var(--r)}
table.sz{width:100%;border-collapse:collapse;min-width:420px}
table.sz th,table.sz td{padding:16px 20px;text-align:start;border-bottom:1px solid var(--line)}
table.sz th{font-weight:600;color:var(--mute);font-size:.9rem}
table.sz tr:last-child td{border-bottom:0}
.note{color:var(--mute);font-size:.88rem;margin-top:12px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.step{background:var(--paper);padding:28px;border-radius:var(--r)}
.step b{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;font-weight:600;margin-bottom:18px}
.step h3{font-size:1.1rem;margin-bottom:6px}
.step p{color:var(--mute)}
@media(max-width:760px){.steps{grid-template-columns:1fr}}

/* faq */
.faq{max-width:820px}
.faq details{border-top:1px solid var(--line);padding:20px 0}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';font-size:1.4rem;line-height:1;transition:transform .3s var(--ease)}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{color:var(--mute);margin-top:12px;max-width:62ch}

/* footer */
footer{background:var(--paper);padding:48px 0 32px;border-top:1px solid var(--line)}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:32px}
.foot p{color:var(--mute);max-width:36ch;margin-top:10px}
.foot ul{list-style:none;display:grid;gap:8px}
.foot a{text-decoration:none}
.foot a:hover{text-decoration:underline}
.copy{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);color:var(--mute);font-size:.85rem}

/* floating whatsapp */
.fab{position:fixed;inset-inline-end:20px;bottom:20px;z-index:40;width:56px;height:56px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.22);transition:transform .25s var(--ease)}
.fab:hover{transform:scale(1.08)}
.fab svg{width:30px;height:30px;fill:#fff}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(10,10,10,.5);display:none;opacity:0;transition:opacity .3s}
.overlay.show{display:flex}
.overlay.in{opacity:1}
.modal{margin:auto;width:min(980px,100% - 24px);max-height:calc(100vh - 24px);overflow:auto;background:var(--bg);border-radius:10px;position:relative;transform:translateY(20px) scale(.985);transition:transform .4s var(--ease)}
.overlay.in .modal{transform:none}
.x{position:absolute;inset-inline-end:14px;top:14px;width:40px;height:40px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:1.3rem;z-index:3;transition:background .2s,color .2s}
.x:hover{background:var(--ink);color:#fff}

/* product modal */
.pm{display:grid;grid-template-columns:1.05fr 1fr}
.gal{background:var(--panel);padding:16px;display:grid;gap:12px;align-content:start}
.gal .main{aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:var(--panel)}
.gal .main img{width:100%;height:100%;object-fit:cover;animation:fadein .4s forwards;opacity:0}
.thumbs{display:flex;gap:10px}
.thumbs button{width:68px;aspect-ratio:4/5;border-radius:4px;overflow:hidden;border:2px solid transparent;background:var(--panel);opacity:.65;transition:.2s}
.thumbs button[aria-current=true]{border-color:var(--ink);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info{padding:clamp(24px,4vw,44px);display:flex;flex-direction:column;gap:20px}
.info h2{font-size:clamp(1.7rem,3vw,2.3rem)}
.info .pr{font-size:1.4rem;font-weight:600}
.info .ds{color:var(--mute)}
.lbl{font-weight:600;font-size:.9rem;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.lbl span{font-weight:400;color:var(--mute)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:36px;height:36px;border-radius:50%;border:1px solid rgba(0,0,0,.25);position:relative;transition:transform .2s}
.sw[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:3px}
.sw:hover{transform:scale(1.08)}
.sz-b{min-width:52px;height:46px;padding:0 14px;border:1px solid var(--ink);border-radius:var(--r);font-weight:500;transition:.2s}
.sz-b:hover{background:var(--panel)}
.sz-b[aria-pressed=true]{background:var(--ink);color:#fff}
.sz-err{color:var(--danger);font-size:.88rem;margin-top:8px;min-height:1.3em}
.qty{display:inline-flex;align-items:center;border:1px solid var(--ink);border-radius:var(--r)}
.qty button{width:42px;height:44px;font-size:1.2rem}
.qty output{min-width:36px;text-align:center;font-weight:600}
.buy{display:flex;gap:12px;flex-wrap:wrap}
.buy .btn{flex:1;min-width:180px}
.info ul.det{margin-inline-start:18px;color:var(--mute);display:grid;gap:4px}
@media(max-width:820px){.pm{grid-template-columns:1fr}}

/* drawer */
.drawer-ov{justify-content:flex-end}
.drawer{width:min(440px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .45s var(--ease)}
[dir=rtl] .drawer{transform:translateX(-100%)}
.overlay.in .drawer{transform:none}
.drawer header{padding:20px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:1.4rem}
.drawer header .x{position:static}
.d-body{flex:1;overflow:auto;padding:8px 24px}
.d-foot{padding:20px 24px;border-top:1px solid var(--line);background:var(--paper)}
.line-item{display:grid;grid-template-columns:76px 1fr auto;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);animation:fadein .4s forwards;opacity:0}
.line-item .th{aspect-ratio:4/5;background:var(--panel);border-radius:4px;overflow:hidden}
.line-item .th img{width:100%;height:100%;object-fit:cover}
.line-item h4{font-size:.98rem}
.line-item small{color:var(--mute);display:block}
.qty.s button{width:32px;height:32px;font-size:1rem}
.qty.s output{min-width:28px;font-size:.9rem}
.line-item .rm{color:var(--mute);font-size:.82rem;text-decoration:underline;margin-top:6px}
.empty{text-align:center;padding:64px 12px;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:1.15rem;margin-bottom:6px}
.row{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.row.t{font-weight:700;font-size:1.15rem;padding-top:12px;margin-top:8px;border-top:1px solid var(--line)}
.d-foot .btn{width:100%;margin-top:16px}
.free-bar{height:4px;background:var(--line);border-radius:4px;margin:10px 0 4px;overflow:hidden}
.free-bar i{display:block;height:100%;background:var(--accent);transition:width .5s var(--ease)}
.free-txt{font-size:.85rem;color:var(--mute)}

/* checkout */
.co{display:grid;grid-template-columns:1.2fr .8fr}
.co form{padding:clamp(24px,4vw,44px);display:grid;gap:16px}
.co h2{font-size:1.8rem;margin-bottom:6px}
.fld label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.fld input,.fld textarea{width:100%;padding:13px 14px;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);transition:border-color .2s}
.fld input:focus,.fld textarea:focus{outline:0;border-color:var(--ink)}
.fld input:invalid:not(:placeholder-shown){border-color:var(--danger)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pay{padding:14px;border:1px solid var(--ink);border-radius:var(--r);display:flex;gap:10px;align-items:center;background:var(--paper)}
.pay i{width:14px;height:14px;border-radius:50%;border:4px solid var(--ink);display:block}
.co aside{background:var(--paper);padding:clamp(24px,4vw,40px)}
.co aside h3{margin-bottom:12px}
.sum-item{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:.92rem;border-bottom:1px dashed var(--line)}
.sum-item small{color:var(--mute);display:block}
@media(max-width:820px){.co{grid-template-columns:1fr}.two{grid-template-columns:1fr}}

/* order confirmation / invoice */
.ok{padding:clamp(24px,4vw,44px)}
.ok .tick{width:56px;height:56px;border-radius:50%;background:var(--accent);display:grid;place-items:center;margin-bottom:16px}
.ok .tick svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .6s .25s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ok h2{font-size:1.9rem}
.ok .lead{color:var(--mute);margin:8px 0 24px;max-width:56ch}
.invoice{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.inv-top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:16px}
.inv-top .logo{font-size:1.5rem}
.inv-meta{text-align:end;font-size:.9rem}
.inv-meta b{font-size:1.05rem}
.inv-cust{display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:.92rem;margin-bottom:18px}
.inv-cust span{color:var(--mute);display:block;font-size:.8rem}
table.inv{width:100%;border-collapse:collapse;font-size:.92rem}
table.inv th{text-align:start;color:var(--mute);font-weight:600;padding:8px 0;border-bottom:1px solid var(--line)}
table.inv td{padding:10px 0;border-bottom:1px solid #f4eee6;vertical-align:top}
table.inv .e{text-align:end}
.inv-tot{margin-top:14px;margin-inline-start:auto;width:min(300px,100%)}
.inv-foot{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);font-size:.85rem;color:var(--mute)}
.ok .btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.ok .btns .btn{flex:1;min-width:190px}

.toast{position:fixed;inset-inline:0;bottom:92px;z-index:200;display:flex;justify-content:center;pointer-events:none}
.toast div{background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:.92rem;transform:translateY(20px);opacity:0;transition:.4s var(--ease)}
.toast.on div{transform:none;opacity:1}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .hero h1 .ln>span{transform:none}.hero p.sub,.hero .cta,.hero-visual{opacity:1;transform:none}
}

/* ---------- print: only the invoice ---------- */
@media print{
  body{background:#fff}
  body>*:not(#orderModal){display:none!important}
  #orderModal{position:static!important;display:block!important;background:#fff!important;opacity:1!important}
  #orderModal .modal{width:100%;max-height:none;overflow:visible;transform:none!important;background:#fff;border-radius:0}
  #orderModal .no-print,#orderModal .x{display:none!important}
  .ok{padding:0}
  .invoice{border:0;padding:0}
  @page{margin:14mm}
}

/* ---------- responsive image sizing: consistent proportions on every screen ---------- */
/* Images scale with the screen, but their frame proportions stay consistent. */
.hero{
  min-height:clamp(340px,42vw,560px);
}
.hero-slides{
  width:42%;
  display:block;
  overflow:hidden;
  -webkit-mask-image:linear-gradient(var(--fade),transparent,#000 22%);
  mask-image:linear-gradient(var(--fade),transparent,#000 22%);
}
.hero-slides img,
.hero-slides img.fb{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  padding:12px;
}
.hero-inner{min-height:clamp(340px,42vw,560px)}
/* Product cards keep the same portrait ratio and show the whole garment/photo. */
.card .ph{aspect-ratio:850/1024}
.card .ph img{object-fit:contain;object-position:center;padding:0}
.gal .main{aspect-ratio:4/5}
.gal .main img{object-fit:contain;object-position:center;padding:0}
.thumbs button{aspect-ratio:4/5}
.thumbs img{object-fit:contain;padding:0}
.line-item .th img{object-fit:contain;padding:3px;background:var(--paper)}
@media(max-width:860px){
  .hero{display:flex;flex-direction:column;min-height:0}
  .hero-slides{
    position:relative;
    inset:auto;
    order:-1;
    width:100%;
    height:auto;
    aspect-ratio:4/3;
    -webkit-mask-image:linear-gradient(#000 82%,transparent);
    mask-image:linear-gradient(#000 82%,transparent);
  }
  .hero-slides img,.hero-slides img.fb{padding:8px}
  .hero-inner{min-height:0}
  .hero-copy{padding:8px 0 24px}
  .hero h1{font-size:clamp(2.8rem,10vw,4.4rem)}
  .hero p.sub{margin:18px 0 24px}
  .arrows{top:auto;bottom:14px;inset-inline-end:14px;flex-direction:row}
}
@media(max-width:480px){
  .wrap{width:calc(100% - 28px)}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .card .ph{aspect-ratio:850/1024}
  .card h3{font-size:.92rem;margin-top:10px}
  .card .price{margin:8px 0}
  .add-btn{height:42px;font-size:.82rem}
  .trust-grid{gap:18px 12px}
  .trust-item{gap:10px}
  .trust-item .ico{font-size:1.8rem}
  .trust-item small{font-size:.78rem}
  .bar{height:66px;gap:8px}
  .logo{font-size:1.8rem}
  .logo img{height:38px}
  .actions{gap:6px}
  .pill{padding:0 10px}
}

</style>
</head>
<body>

<header class="top">
  <div class="wrap bar">
    <a class="logo" href="#top" id="logo" aria-label="Mia Store"></a>
    <nav class="main" aria-label="Main">
      <a href="#top" class="on" data-i="nav_home"></a>
      <a href="#shop" data-i="nav_shop"></a>
      <a href="#sizes" data-i="nav_size"></a>
      <a href="#faq" data-i="nav_faq"></a>
      <a href="#contact" data-i="nav_contact"></a>
    </nav>
    <div class="actions">
      <button class="pill" id="langBtn" aria-label="Change language"></button>
      <button class="cart-btn" id="cartBtn"><span class="ico" data-icon="cart"></span><span class="cart-count" id="cartCount">0</span></button>
    </div>
  </div>
</header>

<main>
  <section class="hero" id="top">
    <div class="hero-slides" id="heroSlides"></div>
    <div class="wrap hero-inner"><div class="hero-copy">
      <p class="eyebrow" data-i="hero_eyebrow"></p>
      <h1 id="heroTitle"></h1>
      <p class="sub" data-i="hero_sub"></p>
      <a class="btn" href="#shop"><span data-i="hero_cta"></span><span class="ico flip" data-icon="arrow"></span></a>
    </div></div>
    <div class="hero-nav" id="heroNav">
      <div class="counter"><span id="slideNow">01</span><i class="vline"><b id="slideBar"></b></i><span id="slideTotal">03</span></div>
      <div class="arrows">
        <button class="arrow-btn" id="prevSlide"><span class="ico flip" data-icon="left"></span></button>
        <button class="arrow-btn fill" id="nextSlide"><span class="ico flip" data-icon="right"></span></button>
      </div>
    </div>
  </section>

  <section id="shop">
    <div class="wrap">
      <div class="sec-head">
        <div><p class="eyebrow" data-i="shop_eyebrow"></p><h2 data-i="shop_title"></h2></div>

<script>
/* =====================================================================
   HELPERS
   ===================================================================== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let lang = store.get('mia_lang', 'en');
if (lang !== 'ar') lang = 'en';          // English is the default
let cart = store.get('mia_cart', []);
const t = k => T[lang][k];
const L = o => (o && typeof o === 'object') ? (o[lang] || o.en) : o;
const nf = n => Number(n).toLocaleString(lang === 'ar' ? 'ar-EG' : 'en-US');
const money = n => `${nf(n)} ${CONFIG.currency[lang]}`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const prod = id => CONFIG.products.find(p => p.id === id);
const imgPath = f => /^(https?:|data:|\/|\.)/.test(f) ? f : CONFIG.imagesFolder + f;   // "a.jpg" -> "images/a.jpg"
const ic = d => `<svg viewBox="0 0 24 24">${d}</svg>`;
const ICONS = {
  cart: ic('<circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2 3h3l2.4 12h11.2L21 7H6"/>'),
  arrow: ic('<path d="M4 12h16M14 6l6 6-6 6"/>'), left: ic('<path d="M15 5l-7 7 7 7"/>'), right: ic('<path d="M9 5l7 7-7 7"/>'),
  truck: ic('<path d="M2 6h11v10H2zM13 9h4l4 3v4h-8"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>'),
  shield: ic('<path d="M12 3l8 3v5c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V6z"/><path d="M8.5 12l2.5 2.5 5-5"/>'),
  headset: ic('<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="13" width="4" height="6" rx="1.5"/><rect x="17" y="13" width="4" height="6" rx="1.5"/><path d="M19 19c0 1.7-2 2.5-5 2.5"/>'),
  leaf: ic('<path d="M20 4C10 4 4 9 4 15c0 2.5 1.5 4.5 4 5 6 0 12-4 12-16zM4 21c2-6 6-9 11-11"/>')
};
const fillIcons = (r = document) => $$('[data-icon]', r).forEach(el => el.innerHTML = ICONS[el.dataset.icon]);
const waLink = text => `https://wa.me/${CONFIG.whatsapp}${text ? '?text=' + encodeURIComponent(text) : ''}`;

/* ---------- placeholder hoodie (used when no photo is set) ---------- */
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  const c = v => Math.max(0, Math.min(255, v + amt));
  return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => c(v).toString(16).padStart(2,'0')).join('');
}
let uid = 0;
function hoodieSVG(hex, view){
  const id = 'g' + (++uid), d = shade(hex, -34), l = shade(hex, 22), dd = shade(hex, -60);
  const back = view === 'back';
  const sleeve = `<path d="M114 142 L70 162 Q50 172 44 198 L28 392 Q27 406 40 408 L84 412 Q96 413 98 400 L118 236 Z" fill="url(#${id}s)"/>
    <path d="M30 384 L97 397 L93 421 Q91 429 81 428 L41 425 Q29 423 29 411 Z" fill="${d}"/>
    <path d="M44 198 Q70 260 92 330" stroke="${dd}" stroke-opacity=".35" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="${id}b" x1="0" x2="1"><stop offset="0" stop-color="${d}"/><stop offset=".35" stop-color="${l}"/><stop offset=".65" stop-color="${hex}"/><stop offset="1" stop-color="${d}"/></linearGradient>
    <linearGradient id="${id}s" x1="0" x2="1"><stop offset="0" stop-color="${d}"/><stop offset=".6" stop-color="${hex}"/><stop offset="1" stop-color="${d}"/></linearGradient>
    <radialGradient id="${id}h" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="${hex}"/><stop offset="1" stop-color="${d}"/></radialGradient>
    <radialGradient id="${id}f" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="200" cy="462" rx="150" ry="14" fill="url(#${id}f)"/>
  <ellipse cx="200" cy="108" rx="70" ry="56" fill="${dd}"/>
  ${sleeve}
  <g transform="translate(400,0) scale(-1,1)">${sleeve}</g>
  <path d="M128 128 L272 128 L286 150 L292 424 Q292 442 272 442 L128 442 Q108 442 108 424 L114 150 Z" fill="url(#${id}b)"/>
  <path d="M108 428 L292 428 L292 440 Q292 454 272 454 L128 454 Q108 454 108 440 Z" fill="${d}"/>
  <path d="M150 440 Q148 300 160 190 M250 440 Q252 300 240 190" stroke="${dd}" stroke-opacity=".18" stroke-width="3" fill="none"/>
  ${back ? `
    <path d="M138 126 Q146 78 200 72 Q254 78 262 126 Q236 146 200 146 Q164 146 138 126 Z" fill="url(#${id}h)"/>
    <path d="M200 76 L200 146" stroke="${dd}" stroke-opacity=".35" stroke-width="2.5"/>
  ` : `
    <path d="M138 126 Q146 70 200 66 Q254 70 262 126 Q236 154 200 154 Q164 154 138 126 Z" fill="url(#${id}h)"/>
    <path d="M158 126 Q165 92 200 90 Q235 92 242 126 Q224 144 200 144 Q176 144 158 126 Z" fill="${dd}"/>
    <path d="M142 330 L258 330 L274 414 L126 414 Z" fill="${hex}" stroke="${dd}" stroke-opacity=".4" stroke-width="2"/>
    <path d="M142 330 L126 414 M258 330 L274 414" stroke="${l}" stroke-opacity=".25" stroke-width="2"/>
    <path d="M184 150 Q180 190 182 240 M216 150 Q220 190 218 240" stroke="${l}" stroke-width="4" stroke-linecap="round" fill="none"/>
    <rect x="178" y="238" width="8" height="14" rx="3" fill="${dd}"/><rect x="214" y="238" width="8" height="14" rx="3" fill="${dd}"/>
  `}
  </svg>`;
}
const svgURI = svg => 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
function imagesFor(p, ci){
  const c = p.colors[ci];
  if (c.images && c.images.length) return c.images.map(imgPath);
  return [svgURI(hoodieSVG(c.hex, 'front')), svgURI(hoodieSVG(c.hex, 'back'))];
}

/* =====================================================================
   RENDER — static text, hero, products, content
   ===================================================================== */
// Missing image file? Log its name (F12 console) and show a placeholder instead of a broken icon.
document.addEventListener('error', e => {
  const im = e.target; if (im.tagName !== 'IMG' || im.dataset.bad) return;
  im.dataset.bad = 1; console.warn('Image not found:', im.getAttribute('src'));
  if (im.closest('.logo')) im.replaceWith(CONFIG.brand);
  else { im.src = svgURI(hoodieSVG('#8a7664', 'front')); im.classList.add('fb'); }
}, true);

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $('#langBtn').textContent = lang === 'ar' ? 'English' : 'العربية';
  $$('[data-i]').forEach(el => { const v = t(el.dataset.i); if (typeof v === 'string') el.textContent = v; });
  // logo
  const logoHTML = CONFIG.logo ? `<img src="${esc(imgPath(CONFIG.logo))}" alt="${esc(CONFIG.brand)}">` : `<span>MIA</span>`;
  $('#logo').innerHTML = logoHTML; $('#footLogo').innerHTML = logoHTML;
  // hero
  const lines = t('hero_title');
  $('#heroTitle').innerHTML = lines.map(l => `<span class="ln"><span>${esc(l)}</span></span>`).join('');
  $('#fab').href = waLink(t('wa_hello'));
  fillIcons(); renderHero();
  $('#prevSlide').setAttribute('aria-label', t('prev')); $('#nextSlide').setAttribute('aria-label', t('next'));
  $('#cartBtn').setAttribute('aria-label', t('cart'));
  renderGrid(); renderTrust(); renderSizes(); renderSteps(); renderFaq(); renderFooter();
  renderCart();
  if (productState) renderProduct();
  if (!$('#checkoutModal').classList.contains('show')) {} else renderCheckout();
  if ($('#orderModal').classList.contains('show') && lastOrder) renderOrder(lastOrder);
  document.title = lang === 'ar' ? 'ميا ستور' : 'Mia Store';
}

/* ---------- hero slider ---------- */
let slide = 0, slideTimer;
const pad = n => String(n).padStart(2, '0');
function renderHero(){
  const files = CONFIG.heroImages.length ? CONFIG.heroImages : [''];
  $('#heroSlides').innerHTML = files.map(f => f ? `<img src="${esc(imgPath(f))}" alt="">` : `<img class="fb" src="${svgURI(hoodieSVG(CONFIG.products[0].colors[0].hex, 'front'))}" alt="">`).join('');
  $('#heroNav').hidden = files.length < 2;
  showSlide(slide);
}
function showSlide(n){
  const imgs = $$('#heroSlides img');
  slide = (n + imgs.length) % imgs.length;
  imgs.forEach((im, i) => im.classList.toggle('on', i === slide));
  $('#slideNow').textContent = pad(slide + 1); $('#slideTotal').textContent = pad(imgs.length);
  $('#slideBar').style.height = (slide + 1) / imgs.length * 100 + '%';
  clearInterval(slideTimer);
  if (imgs.length > 1 && CONFIG.heroSeconds) slideTimer = setInterval(() => showSlide(slide + 1), CONFIG.heroSeconds * 1000);
}
$('#prevSlide').addEventListener('click', () => showSlide(slide - 1));
$('#nextSlide').addEventListener('click', () => showSlide(slide + 1));

/* ---------- products grid ("View All" shows the rest) ---------- */
let showAll = false;
function renderGrid(){
  const list = showAll ? CONFIG.products : CONFIG.products.slice(0, CONFIG.featuredCount);
  $('#viewAll').hidden = CONFIG.products.length <= CONFIG.featuredCount;
  $('#viewAllTxt').textContent = showAll ? t('show_less') : t('view_all');
  $('#grid').innerHTML = list.map(p => {
    const imgs = imagesFor(p, 0), name = esc(L(p.name));
    return `<article class="card" data-open="${p.id}">
      <div class="ph">${p.badge ? `<span class="badge">${esc(L(p.badge))}</span>` : ''}
        <img class="a" src="${esc(imgs[0])}" alt="${name}" loading="lazy">${imgs[1] ? `<img class="b" src="${esc(imgs[1])}" alt="" loading="lazy">` : ''}</div>
      <h3>${name}</h3><div class="clr">${p.colors.map(c => esc(L(c.name))).join(' / ')}</div>
      <div class="price">${money(p.price)}</div>
      <button class="add-btn"><span class="ico" data-icon="cart"></span>${t('add')}</button></article>`;
  }).join('');
  fillIcons($('#grid'));
}
$('#viewAll').addEventListener('click', () => { showAll = !showAll; renderGrid(); });
function renderTrust(){
  $('#trustGrid').innerHTML = CONFIG.trust.map(x => `<div class="trust-item"><span class="ico">${ICONS[x.icon] || ''}</span><div><b>${esc(L(x.title))}</b><small>${esc(L(x.text))}</small></div></div>`).join('');
}
function renderSizes(){
  $('#sizeTable').innerHTML = `<thead><tr><th>${t('th_size')}</th><th>${t('th_chest')}</th><th>${t('th_length')}</th><th>${t('th_sleeve')}</th></tr></thead><tbody>` +
    CONFIG.sizeGuide.map(r => `<tr><td><b>${esc(r.size)}</b></td><td>${nf(r.chest)}</td><td>${nf(r.length)}</td><td>${nf(r.sleeve)}</td></tr>`).join('') + '</tbody>';
}
function renderSteps(){
  $('#steps').innerHTML = t('steps').map((s, i) => `<div class="step"><b>${nf(i+1)}</b><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join('');
}
function renderFaq(){
  const open = $$('#faqList details').map(d => d.open);
  $('#faqList').innerHTML = CONFIG.faq.map((f, i) => `<details ${open[i] ? 'open' : ''}><summary>${esc(L(f.q))}</summary><p>${esc(L(f.a))}</p></details>`).join('');
}
function renderFooter(){
  const links = [`<li><a href="${waLink()}" target="_blank" rel="noopener">${t('whatsapp')}</a></li>`];
  if (CONFIG.instagram) links.push(`<li><a href="${esc(CONFIG.instagram)}" target="_blank" rel="noopener">${t('instagram')}</a></li>`);
  if (CONFIG.email) links.push(`<li><a href="mailto:${esc(CONFIG.email)}">${t('email')}</a></li>`);
  $('#footLinks').innerHTML = links.join('');
  $('#yr').textContent = new Date().getFullYear();
}

/* =====================================================================
   OVERLAYS
   ===================================================================== */
function openOv(id){
  const el = $('#' + id);
  el.classList.add('show');
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  document.body.classList.add('lock');
  el._opener = document.activeElement;
}
function closeOv(id){
  const el = $('#' + id);
  el.classList.remove('in');
  setTimeout(() => {
    el.classList.remove('show');
    if (!$$('.overlay.show').length) document.body.classList.remove('lock');
    if (el._opener && el._opener.focus) try{ el._opener.focus(); }catch(e){}
  }, 320);
  if (id === 'productModal') productState = null;
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ const top = $$('.overlay.show').pop(); if (top) closeOv(top.id); }
});
$$('.overlay').forEach(ov => ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-close]')) closeOv(ov.id); }));

let toastTimer;
function toast(msg){
  const el = $('#toast'); $('div', el).textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2200);
}

/* =====================================================================
   PRODUCT MODAL
   ===================================================================== */
let productState = null;
function openProduct(id){
  productState = { id, ci: 0, size: null, qty: 1, img: 0 };
  renderProduct(); openOv('productModal');
}
function renderProduct(){
  const s = productState; if (!s) return;
  const p = prod(s.id), c = p.colors[s.ci], imgs = imagesFor(p, s.ci);
  if (s.img >= imgs.length) s.img = 0;
  $('#pmBody').innerHTML = `
  <button class="x" data-close aria-label="Close">×</button>
  <div class="pm">
    <div class="gal">
      <div class="main"><img src="${esc(imgs[s.img])}" alt="${esc(L(p.name))}"></div>
      ${imgs.length > 1 ? `<div class="thumbs">${imgs.map((u, i) => `<button data-thumb="${i}" aria-current="${i === s.img}" aria-label="Image ${i+1}"><img src="${esc(u)}" alt=""></button>`).join('')}</div>` : ''}
    </div>
    <div class="info">
      <div><h2>${esc(L(p.name))}</h2><div class="pr">${money(p.price)}</div></div>
      <p class="ds">${esc(L(p.desc))}</p>
      <div><div class="lbl">${t('color')} <span>${esc(L(c.name))}</span></div>
        <div class="opts">${p.colors.map((cc, i) => `<button class="sw" data-color="${i}" aria-pressed="${i === s.ci}" aria-label="${esc(L(cc.name))}" style="background:${cc.hex}"></button>`).join('')}</div></div>
      <div><div class="lbl">${t('size')}</div>
        <div class="opts">${p.sizes.map(z => `<button class="sz-b" data-size="${z}" aria-pressed="${s.size === z}">${z}</button>`).join('')}</div>
        <div class="sz-err" id="szErr"></div></div>
      <div><div class="lbl">${t('qty')}</div>
        <div class="qty"><button data-q="-1" aria-label="-">−</button><output>${nf(s.qty)}</output><button data-q="1" aria-label="+">+</button></div></div>
      <div class="buy">
        <button class="btn" data-add>${t('add')}</button>
      </div>
      <div><div class="lbl">${t('details')}</div><ul class="det">${(L(p.details) || []).map(d => `<li>${esc(d)}</li>`).join('')}</ul></div>
    </div>
  </div>`;
}
$('#pmBody').addEventListener('click', e => {
  const s = productState; if (!s) return;
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.thumb !== undefined){ s.img = +b.dataset.thumb; renderProduct(); }
  else if (b.dataset.color !== undefined){ s.ci = +b.dataset.color; s.img = 0; renderProduct(); }
  else if (b.dataset.size){ s.size = b.dataset.size; renderProduct(); }
  else if (b.dataset.q){ s.qty = Math.max(1, Math.min(10, s.qty + +b.dataset.q)); renderProduct(); }
  else if (b.hasAttribute('data-add')){
    if (!s.size){ $('#szErr').textContent = t('pick_size'); return; }
    addToCart(s.id, s.ci, s.size, s.qty); closeOv('productModal'); toast(t('added'));
    setTimeout(() => { renderCart(); openOv('cartModal'); }, 350);
  }
});
$('#grid').addEventListener('click', e => { const c = e.target.closest('[data-open]'); if (c) openProduct(c.dataset.open); });

/* =====================================================================
   CART
   ===================================================================== */
function addToCart(pid, ci, size, qty){
  const ex = cart.find(i => i.pid === pid && i.ci === ci && i.size === size);
  if (ex) ex.qty = Math.min(10, ex.qty + qty); else cart.push({ pid, ci, size, qty });
  saveCart();
}
function saveCart(){ store.set('mia_cart', cart); }
function cartTotals(){
  const subtotal = cart.reduce((a, i) => a + prod(i.pid).price * i.qty, 0);
  const fr = CONFIG.shipping.freeOver;
  const shipping = !cart.length ? 0 : (fr != null && subtotal >= fr ? 0 : CONFIG.shipping.fee);
  return { subtotal, shipping, total: subtotal + shipping };
}
function renderCart(){
  cart = cart.filter(i => prod(i.pid) && prod(i.pid).colors[i.ci]);
  const count = cart.reduce((a, i) => a + i.qty, 0);
  const cc = $('#cartCount'); cc.textContent = nf(count);
  cc.classList.add('bump'); setTimeout(() => cc.classList.remove('bump'), 250);
  const body = $('#cartBody'), foot = $('#cartFoot');
  if (!cart.length){
    body.innerHTML = `<div class="empty"><b>${t('cart_empty')}</b>${t('cart_empty_sub')}</div>`;
    foot.style.display = 'none'; return;
  }
  foot.style.display = '';
  body.innerHTML = cart.map((i, idx) => {
    const p = prod(i.pid), c = p.colors[i.ci];
    return `<div class="line-item">
      <div class="th"><img src="${esc(imagesFor(p, i.ci)[0])}" alt=""></div>
      <div><h4>${esc(L(p.name))}</h4><small>${esc(L(c.name))} / ${esc(i.size)}</small>
        <div class="qty s" style="margin-top:8px"><button data-cq="${idx}" data-d="-1" aria-label="-">−</button><output>${nf(i.qty)}</output><button data-cq="${idx}" data-d="1" aria-label="+">+</button></div>
        <button class="rm" data-rm="${idx}">${t('remove')}</button></div>
      <div style="font-weight:600">${money(p.price * i.qty)}</div></div>`;
  }).join('');
  const tt = cartTotals(), fr = CONFIG.shipping.freeOver;
  let bar = '';
  if (fr != null){
    const pct = Math.min(100, tt.subtotal / fr * 100);
    bar = `<div class="free-bar"><i style="width:${pct}%"></i></div><div class="free-txt">${tt.subtotal >= fr ? t('free_got') : t('free_left')(money(fr - tt.subtotal))}</div>`;
  }
  foot.innerHTML = `${bar}<div style="margin-top:12px">
    <div class="row"><span>${t('subtotal')}</span><span>${money(tt.subtotal)}</span></div>
    <div class="row"><span>${t('shipping')}</span><span>${tt.shipping ? money(tt.shipping) : t('free')}</span></div>
    <div class="row t"><span>${t('total')}</span><span>${money(tt.total)}</span></div></div>
    <button class="btn" data-checkout>${t('checkout')}</button>`;
}
$('#cartBtn').addEventListener('click', () => { renderCart(); openOv('cartModal'); });
$('#cartModal').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.cq !== undefined){ const it = cart[+b.dataset.cq]; it.qty = Math.max(1, Math.min(10, it.qty + +b.dataset.d)); saveCart(); renderCart(); }
  else if (b.dataset.rm !== undefined){ cart.splice(+b.dataset.rm, 1); saveCart(); renderCart(); }
  else if (b.hasAttribute('data-checkout')){ closeOv('cartModal'); setTimeout(() => { renderCheckout(); openOv('checkoutModal'); }, 330); }
});

/* =====================================================================
   CHECKOUT
   ===================================================================== */
let draft = store.get('mia_customer', {});
function renderCheckout(){
  const keep = {}; $$('#coForm [name]').forEach(f => keep[f.name] = f.value);
  Object.assign(draft, keep);
  const tt = cartTotals();
  $('#coBody').innerHTML = `
  <button class="x" data-close aria-label="Close">×</button>
  <div class="co">
    <form id="coForm" novalidate>
      <h2>${t('checkout_title')}</h2>
      <div class="fld"><label for="f_name">${t('name')}</label><input id="f_name" name="name" required autocomplete="name" placeholder=" " value="${esc(draft.name)}"></div>
      <div class="two">
        <div class="fld"><label for="f_phone">${t('phone')}</label><input id="f_phone" name="phone" required type="tel" inputmode="tel" autocomplete="tel" pattern="[0-9+\\s\\-]{10,16}" placeholder="${t('ph_phone')}" value="${esc(draft.phone)}"></div>
        <div class="fld"><label for="f_city">${t('city')}</label><input id="f_city" name="city" required autocomplete="address-level1" placeholder=" " value="${esc(draft.city)}"></div>
      </div>
      <div class="fld"><label for="f_addr">${t('address')}</label><input id="f_addr" name="address" required autocomplete="street-address" placeholder=" " value="${esc(draft.address)}"></div>
      <div class="fld"><label for="f_notes">${t('notes')}</label><textarea id="f_notes" name="notes" rows="2" placeholder="${t('notes_ph')}">${esc(draft.notes)}</textarea></div>
      <div><div class="lbl">${t('payment')}</div><div class="pay"><i></i>${t('cod')}</div></div>
      <div class="sz-err" id="coErr"></div>
      <button class="btn wa" type="submit" id="placeBtn">${t('place')}</button>
    </form>
    <aside>
      <h3>${t('your_order')}</h3>
      ${cart.map(i => { const p = prod(i.pid), c = p.colors[i.ci];
        return `<div class="sum-item"><div>${esc(L(p.name))} × ${nf(i.qty)}<small>${esc(L(c.name))} / ${esc(i.size)}</small></div><div>${money(p.price * i.qty)}</div></div>`; }).join('')}
      <div style="margin-top:14px">
        <div class="row"><span>${t('subtotal')}</span><span>${money(tt.subtotal)}</span></div>
        <div class="row"><span>${t('shipping')}</span><span>${tt.shipping ? money(tt.shipping) : t('free')}</span></div>
        <div class="row t"><span>${t('total')}</span><span>${money(tt.total)}</span></div>
      </div>
    </aside>
  </div>`;
  $('#coForm').addEventListener('submit', submitOrder);
}

/* =====================================================================
   PLACE ORDER → save, WhatsApp, Google Sheet (optional), invoice
   ===================================================================== */
let lastOrder = null;
function orderNumber(){
  let current = Number(store.get('mia_order_counter', 0));
  current += 1;
  store.set('mia_order_counter', current);
  return `MIA-${String(current).padStart(3, '0')}`;
}
async function submitOrder(e){
  e.preventDefault();
  const form = e.target, err = $('#coErr'); err.textContent = '';
  if (!CONFIG.sheetsWebhook){
    err.textContent = t('sheet_required');
    return;
  }
  if (!form.checkValidity()){
    const bad = form.querySelector(':invalid');
    err.textContent = bad && bad.name === 'phone' ? t('phone_err') : form.querySelector(':invalid').validationMessage;
    bad.focus(); return;
  }
  const f = Object.fromEntries(new FormData(form).entries());
  draft = f; store.set('mia_customer', f);
  const tt = cartTotals();
  const order = {
    id: orderNumber(), createdAt: new Date().toISOString(), lang,
    customer: { name: f.name.trim(), phone: f.phone.trim(), city: f.city.trim(), address: f.address.trim(), notes: (f.notes || '').trim() },
    items: cart.map(i => { const p = prod(i.pid), c = p.colors[i.ci];
      return { id: p.id, name: p.name.en, nameAr: p.name.ar, color: c.name.en, colorAr: c.name.ar, size: i.size, qty: i.qty, price: p.price, line: p.price * i.qty }; }),
    subtotal: tt.subtotal, shipping: tt.shipping, total: tt.total, payment: 'COD', currency: CONFIG.currency.en
  };
  const sheetPayload = {
    id: order.id,
    orderId: order.id,
    createdAt: order.createdAt,
    date: order.createdAt,
    customer: order.customer,
    customerName: order.customer.name,
    name: order.customer.name,
    phone: order.customer.phone,
    city: order.customer.city,
    streetAddress: order.customer.address,
    notes: order.customer.notes,
    address: [order.customer.city, order.customer.address, order.customer.notes && `Notes: ${order.customer.notes}`].filter(Boolean).join(', '),
    product: order.items.map(i => i.name).join('\n'),
    color: order.items.map(i => i.color).join('\n'),
    size: order.items.map(i => i.size).join('\n'),
    quantity: order.items.map(i => i.qty).join('\n'),
    items: order.items,
    subtotal: order.subtotal,
    shipping: order.shipping,
    total: order.total,
    currency: order.currency,
    payment: order.payment,
    status: 'New'
  };
  const button = $('#placeBtn');
  button.disabled = true; button.textContent = t('placing');
  try{
    await fetch(CONFIG.sheetsWebhook, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(sheetPayload)
    });
  }catch(error){
    console.error('Could not submit order to Google Sheets:', error);
    err.textContent = t('sheet_failed');
    button.disabled = false; button.textContent = t('place');
    return;
  }

  const all = store.get('mia_orders', []); all.push(order); store.set('mia_orders', all);
  lastOrder = order;
  cart = []; saveCart(); renderCart();
  closeOv('checkoutModal');
  setTimeout(() => { renderOrder(order); openOv('orderModal'); }, 330);
}

function renderOrder(o){
  const date = new Date(o.createdAt).toLocaleString(lang === 'ar' ? 'ar-EG' : 'en-GB', { dateStyle: 'medium', timeStyle: 'short' });
  const nm = i => lang === 'ar' ? i.nameAr : i.name, cl = i => lang === 'ar' ? i.colorAr : i.color;
  const logoHTML = CONFIG.logo ? `<img src="${esc(imgPath(CONFIG.logo))}" alt="">` : `<span>MIA</span>`;
  $('#orderBody').innerHTML = `
  <button class="x" data-close aria-label="${t('close')}">×</button>
  <div class="ok">
    <div class="no-print">
      <div class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>${t('ok_title')}</h2>
      <p class="lead">${t('ok_lead')}</p>
    </div>
    <div class="invoice" id="invoice">
      <div class="inv-top">
        <div class="logo">${logoHTML}</div>
        <div class="inv-meta"><div>${t('order_no')}</div><b>${esc(o.id)}</b><div>${t('date')}: ${esc(date)}</div></div>
      </div>
      <div class="inv-cust">
        <div><span>${t('customer')}</span>${esc(o.customer.name)}<br>${esc(o.customer.phone)}</div>
        <div><span>${t('deliver_to')}</span>${esc(o.customer.city)}<br>${esc(o.customer.address)}${o.customer.notes ? `<br><i>${esc(o.customer.notes)}</i>` : ''}</div>
      </div>
      <table class="inv"><thead><tr><th>${t('item')}</th><th>${t('qty_s')}</th><th class="e">${t('line')}</th></tr></thead><tbody>
        ${o.items.map(i => `<tr><td>${esc(nm(i))}<br><span style="color:var(--mute)">${esc(cl(i))} / ${esc(i.size)}</span></td><td>${nf(i.qty)}</td><td class="e">${money(i.line)}</td></tr>`).join('')}
      </tbody></table>
      <div class="inv-tot">
        <div class="row"><span>${t('subtotal')}</span><span>${money(o.subtotal)}</span></div>
        <div class="row"><span>${t('shipping')}</span><span>${o.shipping ? money(o.shipping) : t('free')}</span></div>
        <div class="row t"><span>${t('total')}</span><span>${money(o.total)}</span></div>
      </div>
      <div class="inv-foot">${t('inv_foot')}</div>
    </div>
    <div class="btns no-print">
      <button class="btn ghost" data-print>${t('print')}</button>
    </div>
  </div>`;
}
$('#orderModal').addEventListener('click', e => { if (e.target.closest('[data-print]')) window.print(); });

   LANGUAGE
   ===================================================================== */
$('#langBtn').addEventListener('click', () => { lang = lang === 'en' ? 'ar' : 'en'; store.set('mia_lang', lang); applyLang(); });

// highlight the nav link of the section you are looking at
const navLinks = $$('nav.main a');
const spy = new IntersectionObserver(es => es.forEach(en => en.isIntersecting && navLinks.forEach(a => a.classList.toggle('on', a.hash === '#' + en.target.id))), { rootMargin: '-45% 0px -50% 0px' });
['top', 'shop', 'sizes', 'faq', 'contact'].forEach(id => spy.observe($('#' + id)));

applyLang();
</script>
